<header class='c-header'>

  <div class='o-grid'>
    <div class='o-grid__col o-grid__col--full'>
      <div class='c-header__inner'>

        <div class='o-grid'>
          <div class='o-grid__col o-grid__col--3-4-s'>
            <div class='c-logo u-text-left'>
              <a class='c-logo__link' href='{{ site.baseurl }}/'>~</a>
            </div>
          </div>
          <div class='o-grid__col o-grid__col--1-4-s u-text-right'>
            <a class='c-nav__link{% if page.url == "/radar" or page.url == "/radar.html" %} c-nav__link--current{% endif %}' href='{{ "/radar" | prepend: site.baseurl }}'>~/radar</a>
          </div>
        </div>

      </div>
    </div>
  </div>

</header>
