<header class='c-header'>

  <div class='o-grid'>
    <div class='o-grid__col o-grid__col--full'>
      <div class='c-header__inner'>

        <div class='o-grid'>
          <div class='o-grid__col o-grid__col--3-4-s'>
            <div class='c-logo u-text-left'>
              <a class='c-logo__link{% if page.url == "/" or page.url == "/index.html" %} c-logo__link--current{% endif %}' href='{{ site.baseurl }}/'>~</a>
            </div>
          </div>
          <div class='o-grid__col o-grid__col--1-4-s u-text-right'>
            <div class='c-header__nav'>
              <a class='c-nav__link{% if page.url == "/radar" or page.url == "/radar.html" %} c-nav__link--current{% endif %}' href='{{ "/radar" | prepend: site.baseurl }}'>~/radar</a>
              <button class='c-search-trigger' type='button' data-search-open aria-label='Search (press /)' title='Search (/)'>/</button>
              {% comment %}
              <div class='js-off-canvas-toggle c-off-canvas-toggle'>
                <span class='c-off-canvas-toggle__icon'></span>
              </div>
              {% endcomment %}
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</header>

{% comment %}
<div class='c-off-canvas-content'>
  <div class='js-off-canvas-toggle c-off-canvas-toggle c-off-canvas-toggle--close'>
    <span class='c-off-canvas-toggle__icon'></span>
  </div>
  <ul class='o-plain-list c-nav'>
    {% include navigation.html %}
  </ul>
</div>
{% endcomment %}
