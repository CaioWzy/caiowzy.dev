<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name='description' content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel='canonical' href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel='alternate' type='application/rss+xml' title='{{ site.title }}' href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">
  <link rel='icon' id='favicon' type='image/svg+xml' href="{{ '/favicon.svg' | prepend: site.baseurl }}">
  <script>
    (function () {
      var link = document.getElementById('favicon');
      if (!link) return;
      var base = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='#323232'/><path d='M16 20 L30 32 L16 44' fill='none' stroke='#FFFFFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/>";
      var on = "data:image/svg+xml," + encodeURIComponent(base + "<line x1='34' y1='44' x2='48' y2='44' stroke='#00A0FF' stroke-width='6' stroke-linecap='round'/></svg>");
      var off = "data:image/svg+xml," + encodeURIComponent(base + "</svg>");
      var visible = true;
      setInterval(function () {
        visible = !visible;
        link.href = visible ? on : off;
      }, 700);
    })();
  </script>

  <style>
    {% capture inlineCSS %}
      {% include app.scss %}
    {% endcapture %}

    {{ inlineCSS | scssify }}
  </style>
</head>
